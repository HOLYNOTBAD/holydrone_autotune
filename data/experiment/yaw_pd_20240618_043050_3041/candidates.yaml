# 2026-11-12 通过 QGC MAVLink 控制台只读查询生成；数值采用控制台显示精度。
# 读取记录：data/qgc_pid_readback_20261112_145354/readback.yaml
# P/D 以当前值为中心取 80%、90%、100%、110%、120%；零 D 仅保留一档。
# baseline 保留当前 P/I/D/FF/K；候选 I/FF/K 保持 baseline，仅搜索 P/D；退出不自动恢复 baseline。
experiment_id: real_yaw_pd_20261112_145354
axis: yaw
search_stage: manual  # 允许保留原 I/FF；仍自动遍历候选
baseline:
  MC_YAWRATE_P: 0.2
  MC_YAWRATE_I: 0.1
  MC_YAWRATE_D: 0.0
  MC_YAWRATE_FF: 0.0
  MC_YAWRATE_K: 1.2
candidates:  # 按 P 从小到大，每个 P 下依次遍历 D
  - {id: p_0p80_d_1p00, MC_YAWRATE_P: 0.16, MC_YAWRATE_I: 0.1, MC_YAWRATE_D: 0.0, MC_YAWRATE_FF: 0.0, MC_YAWRATE_K: 1.2}
  - {id: p_0p90_d_1p00, MC_YAWRATE_P: 0.18, MC_YAWRATE_I: 0.1, MC_YAWRATE_D: 0.0, MC_YAWRATE_FF: 0.0, MC_YAWRATE_K: 1.2}
  - {id: p_1p00_d_1p00, MC_YAWRATE_P: 0.2, MC_YAWRATE_I: 0.1, MC_YAWRATE_D: 0.0, MC_YAWRATE_FF: 0.0, MC_YAWRATE_K: 1.2}
  - {id: p_1p10_d_1p00, MC_YAWRATE_P: 0.22, MC_YAWRATE_I: 0.1, MC_YAWRATE_D: 0.0, MC_YAWRATE_FF: 0.0, MC_YAWRATE_K: 1.2}
  - {id: p_1p20_d_1p00, MC_YAWRATE_P: 0.24, MC_YAWRATE_I: 0.1, MC_YAWRATE_D: 0.0, MC_YAWRATE_FF: 0.0, MC_YAWRATE_K: 1.2}

altitude_control:
  kp: 2.0
  kd: 2.5
  ki: 0.4
  acceleration_limit: 3.0
  integral_limit: 1.0
  min_thrust: 0.05
  max_thrust: 0.8
recovery:
  horizontal_speed_tolerance_m_s: 0.3  # 每次脉冲前必须完成水平制动
  tilt_tolerance_deg: 5.0  # 每次脉冲前必须接近水平
  angular_speed_tolerance_deg_s: 5.0  # 各轴低通后的角速度合量
  angular_rate_filter_tau_s: 0.05
  timeout_s: 8.0
  position_tolerance_m: 0.5
  horizontal_tolerance_m: 0.75
  yaw_tolerance_deg: 5.0
  angular_feedback_timeout_s: 0.1
excitation:
  settle_s: 0.3
  pulse_duration_s: 0.25
  levels_deg_s: [60, 120]
  repetitions: 1
