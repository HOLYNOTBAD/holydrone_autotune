# 中心 P=0.15、D=0.003，K=0.35；候选为中心值的 80%、90%、100%、110%、120%。
# 这是待验证的 PD 试验配置；候选 I=0，与实机 baseline 的 I=0.20 不同。
# 候选写入会改变飞控 PID；退出试验不会自动恢复 baseline。
experiment_id: real_roll_pd_01
axis: roll
# 进入 Offboard 前在已解锁 POSCTL 稳定悬停，采集当前推力。
search_stage: pd  # I=FF=0，所有候选固定 baseline K
baseline:  # 按飞控浮点读数的有效精度整理；仅人工恢复使用
