altitude_control:  # 脉冲期间：悬停推力 × (1 + 垂直反馈加速度/g) / cos(倾角)
  kp: 2.0  # 高度误差到加速度，1/s²
  kd: 2.5  # 向上速度阻尼，1/s
  ki: 0.4  # 高度误差积分增益，1/s³
  acceleration_limit: 3.0  # 垂直修正加速度限幅，m/s²
  integral_limit: 1.0  # 积分项加速度限幅，m/s²
  min_thrust: 0.05
  max_thrust: 0.8
recovery:  # 每个独立脉冲后由 PX4 位置控制回中；不等待精确返回原始 XY
  horizontal_speed_tolerance_m_s: 0.3  # 每次脉冲前必须完成水平制动
  tilt_tolerance_deg: 5.0  # 每次脉冲前必须接近水平
  angular_speed_tolerance_deg_s: 5.0  # 三轴角速度合量
  timeout_s: 8.0
  position_tolerance_m: 0.5  # 高度容差（沿用原参数名）
  horizontal_tolerance_m: 0.75  # 回中后允许的 XY 偏移；不要求精确回原点
  yaw_tolerance_deg: 5.0
  angular_feedback_timeout_s: 0.1  # 按采样/ROS时钟判断IMU新鲜度；另检查墙钟接收间隔
excitation:  # 每档 low/high：回中稳定→+→位置制动回中→−→位置制动回中；按 repetitions 重复双脉冲组
  settle_s: 0.3  # 回中条件连续满足此时间后开始下一脉冲，s
  pulse_duration_s: 0.25  # 每个正负角速度脉冲时长；s；须为有限正数
  levels_deg_s: [60, 120]  # low/high 两档幅值；deg/s；均 > 0 且 high ≥ low
  repetitions: 1  # 完整激励计划的重复次数；整数，须 ≥ 1
