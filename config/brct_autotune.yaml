# holydrone_lite / PX4 airframe 22001 的仿真候选，由 brct_autotune_fsm 的 ~config 读取。
# 围绕 lite 默认 P=0.054、D=0.0014 搜索；原 P=0.135~0.165、D=0.003 在此模型产生约10Hz振荡。
# 不可直接作为另一机型或实机的已验证参数。
# 候选写入会改变飞控 PID；异步写入并读回确认后自动开始激励。
experiment_id: lite_roll_pd_01  # 写入事件及离线报告的非空会话标识
axis: roll  # FRD 激励轴；可选 roll、pitch、yaw
# 推力由已解锁 POSCTL 下的 target_attitude.thrust 实时采集；每次进入 Offboard 时锁定。
# 切换前先稳定悬停，并等待终端提示推力已就绪；不使用固定推力回退。
# pd fixes K and requires I=FF=0; use manual for later I/FF experiments.
search_stage: pd  # 候选检查模式；pd 要求 I=FF=0，manual 允许非零；两者均固定 K
baseline:  # 人工恢复使用的 P/I/D/FF/K；不会自动恢复
  MC_ROLLRATE_P: 0.054  # roll 角速度环比例项；须为有限非负数
  MC_ROLLRATE_I: 0.074  # roll 角速度环积分项；须为有限非负数
  MC_ROLLRATE_D: 0.0014  # roll 角速度环微分项；须为有限非负数
  MC_ROLLRATE_FF: 0.000  # roll 角速度环前馈项；须为有限非负数
  MC_ROLLRATE_K: 1.000  # roll 环总增益；须为有限正数，所有候选保持 baseline 值
